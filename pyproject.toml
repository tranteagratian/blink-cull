[project]
name = "blink-cull"
version = "0.1.0"
description = "Find photos with closed eyes in a folder of Sony ARW files. Local, read-only, with a desktop app and a Lightroom Classic plugin."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Trantea Robert Gratian" }]
keywords = ["photography", "culling", "closed eyes", "blink detection", "lightroom", "sony", "arw"]

requires-python = ">=3.12"
dependencies = [
    "mediapipe==0.10.21",
    "numpy<2",
    "opencv-python==4.10.0.84",
    "pillow>=12.3.0",
    "pywebview>=6.2.1",
    "rawpy>=0.27.1",
]

[project.urls]
Homepage = "https://github.com/tranteagratian/blink-cull"
Issues = "https://github.com/tranteagratian/blink-cull/issues"

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
experiments = [
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]
test = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
